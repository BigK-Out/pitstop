<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        gap: 64px;
        padding: 0 96px;
        box-sizing: border-box;
        background: linear-gradient(160deg, #ffd6c2, #ffb38a);
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        color: #2a0b12;
      }
      img {
        width: 320px;
        height: 320px;
      }
      h1 {
        margin: 0;
        font-size: 120px;
        color: #a3102a;
        line-height: 1;
      }
      p {
        margin: 16px 0 0;
        font-size: 44px;
      }
    </style>
  </head>
  <body>
    <img src="../public/favicon.svg" alt="" />
    <div>
      <h1>Pitstop</h1>
      <p>Sun-dried cherries, nothing added.</p>
    </div>
  </body>
</html>
